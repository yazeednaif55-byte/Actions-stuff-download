<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9;">

  <h1>أهلاً بك في موقعي</h1>

  <!-- زر ينقل لموقع آخر -->
  <button onclick="window.location.href='https://google.com'" style="padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background-color: #007bff; color: white;">
    الانتقال للموقع
  </button>

  <br><br>

  <!-- زر لإظهار وإخفاء الفريم -->
  <button onclick="toggleFrame()" style="padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; background-color: #28a745; color: white;">
    إظهار / إخفاء الفريم
  </button>

  <!-- الفريم -->
  <div id="myFrame" style="display: none; margin-top: 20px;">
    <iframe src="https://bing.com" width="100%" height="450px" style="border: 1px solid #ccc; border-radius: 8px;"></iframe>
  </div>

  <script>
    function toggleFrame() {
      var f = document.getElementById("myFrame");
      f.style.display = (f.style.display === "none") ? "block" : "none";
    }
  </script>

</body>
</html>
